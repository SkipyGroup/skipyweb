<!doctype html><html lang="hu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: http: https:"><title>Skipy</title></head><body>
<aside id="library-panel" class="library-panel" hidden><div class="panel-heading"><h2 id="panel-title"></h2><button id="panel-close" aria-label="Bezárás"><i data-lucide="x"></i></button></div><div id="panel-actions" class="panel-actions"></div><div id="panel-list" class="panel-list"></div></aside>
<section id="tool-popover" class="tool-popover" hidden></section>
<section id="download-confirm" class="download-confirm" hidden><div class="download-confirm-card"><div class="download-confirm-icon"><i data-lucide="download"></i></div><div><h2>Letöltöd ezt a fájlt?</h2><strong id="download-confirm-name"></strong><p id="download-confirm-meta"></p></div><div class="download-confirm-actions"><button id="download-confirm-cancel">Mégse</button><button id="download-confirm-custom">Egyéni hely…</button><button id="download-confirm-accept">Letöltés</button></div></div></section>
<section id="js-dialog" class="js-dialog" hidden><form id="js-dialog-card" class="js-dialog-card"><div class="js-dialog-mark">!</div><div class="js-dialog-copy"><span id="js-dialog-host"></span><h2 id="js-dialog-title"></h2><p id="js-dialog-message"></p><input id="js-dialog-input" maxlength="2000" autocomplete="off"></div><div class="js-dialog-actions"><button id="js-dialog-cancel" type="button">Mégse</button><button id="js-dialog-accept" type="submit">Rendben</button></div></form></section>
<section id="swp-prompt" class="swp-prompt" hidden><div class="swp-prompt-card"><div class="swp-prompt-mark"><i data-lucide="shield"></i></div><div><span id="swp-prompt-site"></span><h2 id="swp-prompt-title"></h2><p id="swp-prompt-message"></p></div><div class="swp-prompt-actions"><button data-decision="deny">Most nem</button><button data-decision="always-block">Mindig tiltás</button><button data-decision="always-allow">Mindig engedélyezés</button><button data-decision="once">Egyszer engedélyezés</button></div></div></section>
<script type="module" src="/overlay.ts"></script></body></html>
